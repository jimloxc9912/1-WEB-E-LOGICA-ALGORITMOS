<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Viajes</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1></i> Planificador de Viajes</h1>
            <nav class="tabs">
                <button class="tab-btn active" data-tab="agregar"><i class="fas fa-plus-circle"></i> Agregar Destino</button>
                <button class="tab-btn" data-tab="itinerario"><i class="fas fa-route"></i> Itinerario</button>
                <button class="tab-btn" data-tab="info"><i class="fas fa-info-circle"></i> Información de Destinos</button>
            </nav>
        </header>

        <main class="main-content">
            <!-- Sección Agregar Destino -->
            <section id="agregar" class="tab-content active">
                <h2>Agregar Nuevo Destino</h2>
                <form id="viajeForm">
                    <div class="form-group">
                        <label for="destino">Destino:</label>
                        <select id="destino" required>
                            <option value="">Selecciona un destino</option>
                            <option value="Paris">París, Francia</option>
                            <option value="Londres">Londres, Reino Unido</option>
                            <option value="New York">Nueva York, USA</option>
                            <option value="Tokio">Tokio, Japón</option>
                            <option value="Roma">Roma, Italia</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha de Viaje:</label>
                        <input type="date" id="fecha" required>
                    </div>

                    <div class="form-group">
                        <label for="transporte">Medio de Transporte:</label>
                        <select id="transporte" required>
                            <option value="">Selecciona transporte</option>
                            <option value="Avión">Avión</option>
                            <option value="Tren">Tren</option>
                            <option value="Autobús">Autobús</option>
                            <option value="Barco">Barco</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="personas">Número de Personas:</label>
                        <input type="number" id="personas" min="1" value="1">
                    </div>

                    <button type="submit" class="btn">
                        <i class="fas fa-plus-circle"></i> Agregar Destino
                    </button>
                </form>
            </section>

            <!-- Sección Itinerario -->
            <section id="itinerario" class="tab-content">
                <h2>Tu Itinerario</h2>
                <div class="actions">
                    <button id="calcularBtn" class="btn secondary">
                        <i class="fas fa-calculator"></i> Calcular Costo Total
                    </button>
                    <button id="limpiarBtn" class="btn danger">
                        <i class="fas fa-trash-alt"></i> Limpiar Todo
                    </button>
                </div>
                
                <div id="itinerario" class="itinerario-container">
                    <p class="empty-message">No hay destinos agregados aún. ¡Comienza a planificar tu viaje!</p>
                </div>

                <div id="totalContainer" class="total-container hidden">
                    <h3>Costo Total Estimado:</h3>
                    <p id="totalAmount">$0</p>
                </div>
            </section>

            <!-- Sección Información de Destinos -->
            <section id="info" class="tab-content">
                <h2>Información de Destinos</h2>
                <div class="info-grid">
                    <!-- Los destinos se mostrarán aquí dinámicamente -->
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
